<!doctype html>
<!-- Store hero image. Render at 1440x720:
     msedge --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,720 --screenshot=hero.png hero.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1440px; height: 720px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 72% 50%, #1c1a17 0%, #0b0a09 55%, #000 100%);
    font-family: Bahnschrift, "Segoe UI", sans-serif;
    color: #F2E8D5;
    position: relative;
  }
  .text { position: absolute; left: 110px; top: 50%; transform: translateY(-50%); width: 560px; }
  .text img { width: 96px; height: 96px; display: block; margin-bottom: 28px; }
  h1 { font-size: 112px; font-weight: 300; letter-spacing: 6px; margin: 0; line-height: 1; }
  .rule { width: 220px; height: 6px; background: #FF6F5E; margin: 30px 0 30px; }
  p { font-size: 32px; font-weight: 300; color: #8A8478; margin: 0; line-height: 1.45; }
  .watch {
    position: absolute; right: 150px; top: 50%; transform: translateY(-50%);
    width: 520px; height: 520px; border-radius: 50%;
    border: 18px solid #23211e; box-shadow: 0 0 0 3px #3a3732, 0 30px 80px rgba(0,0,0,.7);
    overflow: hidden; background: #000;
  }
  .watch img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="text">
    <img src="logo.svg" alt="">
    <h1>MENHIR</h1>
    <div class="rule"></div>
    <p>Big numerals. Five fields you pick.<br>Nothing else.</p>
  </div>
  <div class="watch"><img src="screenshot.png" alt=""></div>
</body>
</html>
