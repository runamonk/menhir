<!doctype html>
<!-- Store cover image. Render at 500x500:
     msedge --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=500,500 --screenshot=cover.png cover.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 500px; height: 500px; overflow: hidden; }
  body { background: radial-gradient(circle at 50% 50%, #1c1a17 0%, #0b0a09 60%, #000 100%); position: relative; }
  .watch {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 400px; height: 400px; border-radius: 50%;
    border: 14px solid #23211e; box-shadow: 0 0 0 3px #3a3732, 0 20px 50px rgba(0,0,0,.7);
    overflow: hidden; background: #000;
  }
  .watch img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="watch"><img src="screenshot.png" alt=""></div>
</body>
</html>
